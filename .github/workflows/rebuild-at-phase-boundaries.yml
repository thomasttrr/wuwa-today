name: Rebuild at banner phase boundaries

# The home hero, /banners, the accent colour and the live/ended filters are
# decided at build time (see UPDATE_PLAYBOOK.md). This workflow fires the
# Vercel Deploy Hook shortly after every phase start/end recorded in
# data/banners.json, every event start/end in data/events.json, every redeem
# code expiry in data/codes.json and the announced next version's launch day,
# plus one unconditional rebuild a day as a fallback.
# Requires the repo secret VERCEL_DEPLOY_HOOK_URL (Vercel project ->
# Settings -> Git -> Deploy Hooks). Until the secret exists the jobs
# succeed quietly and do nothing.

on:
  schedule:
    - cron: "7 * * * *" # hourly boundary check
    - cron: "0 9 * * *" # daily fallback rebuild (~4 AM ET)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  boundary-check:
    if: github.event.schedule != '0 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fire the deploy hook if a phase boundary just passed
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK_URL secret is not set yet - skipping."
            exit 0
          fi
          DUE=$(python3 - <<'PY'
          import json, datetime, sys
          SERVER_TZ = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(datetime.timezone.utc)
          lo = now - datetime.timedelta(minutes=70)
          hi = now + datetime.timedelta(minutes=5)
          due = []
          # Banner phases and events both flip state at build time, so a
          # boundary in either file needs a rebuild.
          bj = json.load(open("data/banners.json"))
          records = bj["banners"] + json.load(open("data/events.json"))["events"]
          # The announced next version's launch day flips the home hero and
          # page kickers even before its banners are entered.
          nv = bj.get("nextVersion") or {}
          if nv.get("launchAt"):
              records.append({"id": "nextVersion " + nv.get("version", "?"), "startsAt": nv["launchAt"]})
          # A redeem code's expiry also changes the built home page (the
          # glance strip and the codes list), so it counts as a boundary too.
          for c in json.load(open("data/codes.json")).get("active", []):
              if c.get("expiresAt"):
                  records.append({"id": "code " + c["code"], "endsAt": c["expiresAt"]})
          for b in records:
              for key in ("startsAt", "endsAt"):
                  raw = b.get(key)
                  if not raw:
                      continue
                  # One bad record must never stop every hourly check.
                  try:
                      t = datetime.datetime.fromisoformat(raw)
                  except ValueError:
                      print(f"::warning::{b.get('id')} {key} is not a date: {raw}", file=sys.stderr)
                      continue
                  if t.tzinfo is None:
                      print(f"::warning::{b.get('id')} {key} has no UTC offset, assuming +08:00: {raw}", file=sys.stderr)
                      t = t.replace(tzinfo=SERVER_TZ)
                  if lo <= t <= hi:
                      due.append(f"{b['id']} {key} {raw}")
          print("\n".join(due))
          PY
          )
          if [ -n "$DUE" ]; then
            echo "Phase boundary passed:"
            echo "$DUE"
            curl -fsS -X POST "$HOOK"
            echo "Deploy hook fired."
          else
            echo "No phase boundary in the last 70 minutes."
          fi

  daily-fallback:
    if: github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Fire the deploy hook (daily fallback)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK_URL secret is not set yet - skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Deploy hook fired (daily fallback)."
